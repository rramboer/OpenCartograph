name: Generate Map from Issue

on:
  issues:
    types: [opened]

jobs:
  generate:
    if: contains(github.event.issue.labels.*.name, 'map-request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: write
    concurrency:
      group: render-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Acknowledge request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "⏳ Generating your map… this usually takes 2–4 minutes. You'll be notified by email when it's ready."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install opencartograph
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render map
        id: render
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/render_from_issue.py

      - name: Upload to renders branch
        id: upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RENDER_PATH: ${{ steps.render.outputs.path }}
        run: python .github/scripts/upload_render.py

      - name: Post result and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/renders/${{ steps.upload.outputs.path }}"
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "✅ Your map is ready!

          ![map]($URL)

          [Download full resolution]($URL)"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "❌ Sorry, something went wrong generating your map.

          Common issues:
          - **City + country couldn't be geocoded** — try adding state, or use the Override coordinates fields
          - **Network timeout fetching OSM data** — try opening a new issue
          - **Invalid theme name** — see the [theme swatches](https://github.com/${{ github.repository }}/blob/main/examples/theme_swatches.png)

          [View workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
