name: Prune Old Renders

on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only print what would be pruned)"
        type: boolean
        default: true
      max_age_days:
        description: "Prune renders for issues closed more than N days ago"
        type: string
        default: "30"

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: read

    steps:
      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling the workflow resets that clock and bumps its
      # updated_at, so it is re-enabled once that is 45 days old: the weekly
      # schedule then gets two chances before day 60 in case a run is skipped.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: repos/${{ github.repository }}/actions/workflows/prune-renders.yml
        run: |
          updated=$(gh api "$WORKFLOW" --jq .updated_at)
          age_days=$(( ( $(date +%s) - $(date -d "$updated" +%s) ) / 86400 ))
          echo "Workflow last enabled or changed ${age_days} days ago"
          if [ "$age_days" -ge 45 ]; then
            gh api -X PUT "$WORKFLOW/enable"
            echo "Re-enabled to reset the inactivity clock"
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        run: python .github/scripts/prune_renders.py
