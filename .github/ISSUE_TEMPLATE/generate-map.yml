name: Create a Map
description: Generate a custom OpenCartograph map poster — no install required
title: "[Map] "
labels: ["map-request"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the form below — your map will be generated automatically and posted as a comment on this issue (usually 2–4 minutes).

        **Picking a theme?** See the [theme swatches](https://github.com/rramboer/OpenCartograph/blob/main/examples/theme_swatches.png) for a visual reference.

  - type: input
    id: city
    attributes:
      label: City
      placeholder: e.g. Paris
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country
      placeholder: e.g. France
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - amethyst
        - arctic
        - autumn
        - blueprint
        - butter
        - contrast_zones
        - copper_patina
        - crimson
        - emerald
        - espresso
        - forest
        - gradient_roads
        - japanese_ink
        - midnight_blue
        - monochrome_blue
        - neon_cyberpunk
        - night_drive
        - noir
        - ocean
        - oxblood
        - pastel_dream
        - prussian
        - sakura
        - sunset
        - terracotta
        - tropical
        - vaporwave
        - warm_beige
      default: 24
    validations:
      required: true

  - type: dropdown
    id: zoom
    attributes:
      label: Zoom level
      description: Roughly how much area around the center to include.
      options:
        - "Neighborhood (3 mi)"
        - "Downtown (5 mi)"
        - "City (10 mi)"
        - "Metro (20 mi)"
        - "Wide metro (35 mi)"
        - "Region (50 mi)"
        - "State (100 mi)"
        - "Multi-state (150 mi)"
      default: 2
    validations:
      required: true

  - type: dropdown
    id: quality
    attributes:
      label: Quality
      description: Higher quality means a larger file and a longer render time.
      options:
        - "Low (fast preview)"
        - "Standard"
        - "High"
        - "Ultra (very large file, slow render)"
      default: 1
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Optional

        Leave any of the fields below blank to use defaults.

  - type: input
    id: display_city
    attributes:
      label: Display name for city
      description: Override what's printed on the poster (e.g. "東京" while geocoding still uses "Tokyo").
      placeholder: leave blank to use the City field above

  - type: input
    id: display_country
    attributes:
      label: Display name for country
      placeholder: leave blank to use the Country field above

  - type: input
    id: lat
    attributes:
      label: Override latitude
      description: Skip city geocoding and use exact coordinates. Requires longitude too.
      placeholder: e.g. 48.8566

  - type: input
    id: lon
    attributes:
      label: Override longitude
      placeholder: e.g. 2.3522

  - type: input
    id: width
    attributes:
      label: Custom width in inches
      description: Overrides the quality preset width. Max 20.
      placeholder: e.g. 14

  - type: input
    id: height
    attributes:
      label: Custom height in inches
      description: Overrides the quality preset height. Max 20.
      placeholder: e.g. 11

  - type: input
    id: rotation
    attributes:
      label: Map rotation in degrees
      description: Rotate the map clockwise. Range -180 to 180.
      placeholder: e.g. 45

  - type: dropdown
    id: compass
    attributes:
      label: Compass badge
      description: Whether to show the north-arrow compass.
      options:
        - "Auto (shown when rotated)"
        - "Always show"
        - "Always hide"
      default: 0

  - type: input
    id: line_scale
    attributes:
      label: Road width scale
      description: Scale factor for road thickness. Default 1.0; >1 thicker, <1 thinner.
      placeholder: e.g. 1.5

  - type: input
    id: font_family
    attributes:
      label: Google Fonts family
      description: Use a specific Google Font (e.g. "Noto Sans JP" for Japanese, "Playfair Display"). Auto-downloaded.
      placeholder: e.g. Noto Sans JP

  - type: checkboxes
    id: layers
    attributes:
      label: Extra layers
      description: Each adds an extra OpenStreetMap data fetch.
      options:
        - label: Airports
        - label: National parks
        - label: Stadiums
        - label: Buildings (heavy for dense cities)

  - type: checkboxes
    id: text
    attributes:
      label: Text overlay
      options:
        - label: Show date
        - label: Show OpenStreetMap attribution
        - label: No text overlay (map only)
